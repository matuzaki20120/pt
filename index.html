<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ポーカー成績トラッカー（週次・月次／JSONバックアップ＆インポート）</title>
    <style>
      :root {
        --bg: #f7f7fb;
        --card: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --muted: #6b7280;
        --green: #059669;
        --red: #dc2626;
      }
      [data-theme='dark'] {
        --bg: #0f172a;
        --card: #111827;
        --border: #374151;
        --text: #f3f4f6;
        --muted: #9ca3af;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background: var(--bg); color: var(--text); }
      .container { max-width: 1040px; margin: 0 auto; padding: 28px 16px; }
      .header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
      .title { font-size: 22px; font-weight: 800; }
      .subtitle { font-size: 12px; color: var(--muted); }
      .btn { border:1px solid var(--border); background:var(--card); color:var(--text); padding:8px 12px; border-radius:12px; cursor:pointer; }
      .btn:hover { opacity: .9; }
      .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
      .grid { display:grid; gap:12px; }
      .grid.stats { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .grid.week { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .grid.month { grid-template-columns: repeat(6, minmax(0,1fr)); }
      @media (max-width: 920px) {
        .grid.stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .grid.week { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .grid.month { grid-template-columns: repeat(2, minmax(0,1fr)); }
      }
      .stat-title { font-size: 12px; color: var(--muted); }
      .stat-value { margin-top:4px; font-size: 22px; font-weight: 800; }
      .row { display:grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap:12px; }
      .input { width:100%; border:1px solid var(--border); border-radius:12px; padding:8px 12px; background:var(--card); color: var(--text); }
      .mono { font-variant-numeric: tabular-nums; }
      .good { color: var(--green); }
      .bad { color: var(--red); }
      .table { width:100%; border-collapse: collapse; }
      .table th, .table td { padding: 10px 8px; border-top:1px solid var(--border); text-align:right; }
      .table th:first-child, .table td:first-child { text-align:left; }
      .table thead th { color: var(--muted); background: rgba(0,0,0,.02); }
      .section { font-size: 16px; font-weight: 800; margin: 22px 0 10px; }
      .footer { color: var(--muted); font-size: 11px; margin-top: 24px; }
      .hidden-input { display:none; }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useMemo, useState, useRef } = React;
      const LS_KEY = 'poker_sessions_v4'; // 既存ユーザーのデータと互換
      const THEME_KEY = 'poker_theme';

      function loadSessions(){
        try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : []; } catch { return []; }
      }
      function saveSessions(arr){ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }

      // helpers
      const toNum = (v)=> Number(v) || 0;
      const fmt = (n)=> n.toLocaleString(undefined);
      const fmt$ = (n)=> n.toLocaleString(undefined, { style:'currency', currency:'USD', maximumFractionDigits:0 });
      const fmtH = (n)=> n.toLocaleString(undefined, { maximumFractionDigits:2 });

      function monthKey(dateISO){
        const d = new Date(dateISO + 'T00:00:00');
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      }
      // ISO week: YYYY-Www
      function isoWeekKey(dateISO){
        const d = new Date(dateISO + 'T00:00:00');
        const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const dayNum = date.getUTCDay() || 7;
        date.setUTCDate(date.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
        const weekNo = Math.ceil((((date.getTime() - yearStart.getTime()) / 86400000) + 1) / 7);
        return date.getUTCFullYear() + '-W' + String(weekNo).padStart(2,'0');
      }

      function App(){
        const [sessions, setSessions] = useState(loadSessions);
        const [form, setForm] = useState({ date: new Date().toISOString().slice(0,10), before:'', after:'', hands:'', hours:'' });
        const [theme, setTheme] = useState(localStorage.getItem(THEME_KEY) || 'light');
        const importInputRef = useRef(null);

        useEffect(()=>{
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem(THEME_KEY, theme);
        }, [theme]);
        useEffect(()=>{ saveSessions(sessions); }, [sessions]);

        const add = ()=>{
          const s = { id: crypto.randomUUID(), date: form.date, before: toNum(form.before), after: toNum(form.after), hands: toNum(form.hands), hours: toNum(form.hours) };
          setSessions(prev => [...prev, s]);
          setForm({ date: new Date().toISOString().slice(0,10), before:'', after:'', hands:'', hours:'' });
        };
        const delAll = ()=>{ if(confirm('全データを削除します。よろしいですか？')) setSessions([]); };

        // derived
        const enriched = useMemo(()=> sessions.map(s => ({ ...s, profit: s.after - s.before, hourly: s.hours ? (s.after - s.before)/s.hours : 0 })), [sessions]);
        const totalProfit = useMemo(()=> enriched.reduce((a,b)=>a+b.profit,0), [enriched]);
        const totalHours = useMemo(()=> enriched.reduce((a,b)=>a+b.hours,0), [enriched]);
        const hourly = totalHours ? totalProfit/totalHours : 0;

        // group by week/month
        const { weeks, months } = useMemo(()=>{
          const w = new Map(); const m = new Map();
          for(const s of enriched){
            const wk = isoWeekKey(s.date);
            w.set(wk, (w.get(wk)||0) + s.profit);
            const mk = monthKey(s.date);
            m.set(mk, (m.get(mk)||0) + s.profit);
          }
          const wArr = Array.from(w.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
          const mArr = Array.from(m.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
          return { weeks: wArr, months: mArr };
        }, [enriched]);

        const backupJSON = ()=>{
          const blob = new Blob([JSON.stringify(sessions,null,2)], {type:'application/json'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'poker_backup.json'; a.click();
        };

        const importJSON = (file)=>{
          const reader = new FileReader();
          reader.onload = ()=>{
            try{
              const data = JSON.parse(String(reader.result||'[]'));
              if (!Array.isArray(data)) throw new Error('invalid');
              // 軽いバリデーション
              const normalized = data.map((s)=> ({
                id: s.id || crypto.randomUUID(),
                date: s.date || new Date().toISOString().slice(0,10),
                before: Number(s.before)||0,
                after: Number(s.after)||0,
                hands: Number(s.hands)||0,
                hours: Number(s.hours)||0,
              }));
              setSessions(normalized);
              alert('インポートが完了しました。');
            } catch(e){
              alert('JSONの形式が正しくありません。');
            }
          };
          reader.readAsText(file);
        };

        return (
          <div className="container">
            <div className="header">
              <div>
                <div className="title">ポーカー成績トラッカー</div>
                <div className="subtitle">ローカル保存・ライト/ダーク・週次/月次集計・JSONバックアップ＆インポート</div>
              </div>
              <div style={{display:'flex', gap:8, alignItems:'center'}}>
                <button className="btn" onClick={()=>setTheme(theme==='light'?'dark':'light')}>{theme==='light'?'🌙 ダーク':'☀️ ライト'}モード</button>
                <button className="btn" onClick={backupJSON}>JSONバックアップ</button>
                <input ref={importInputRef} className="hidden-input" type="file" accept="application/json,.json" onChange={(e)=>{ const f=e.target.files?.[0]; if(f) importJSON(f); e.target.value=''; }} />
                <button className="btn" onClick={()=>importInputRef.current?.click()}>JSONインポート</button>
              </div>
            </div>

            <div className="grid stats" style={{marginTop:12}}>
              <div className="card">
                <div className="stat-title">累計収支</div>
                <div className="stat-value mono">{fmt$(totalProfit)}</div>
              </div>
              <div className="card">
                <div className="stat-title">総稼働時間</div>
                <div className="stat-value mono">{fmtH(totalHours)} h</div>
              </div>
              <div className="card">
                <div className="stat-title">平均時給</div>
                <div className="stat-value mono">{fmt$(Math.round(hourly))}/h</div>
              </div>
              <div className="card">
                <div className="stat-title">総ハンド数</div>
                <div className="stat-value mono">{fmt(enriched.reduce((a,b)=>a+b.hands,0))}</div>
              </div>
            </div>

            <div className="section">セッション追加</div>
            <div className="card">
              <div className="row">
                <input className="input" type="date" value={form.date} onChange={e=>setForm({...form, date:e.target.value})}/>
                <input className="input" placeholder="前($)" value={form.before} onChange={e=>setForm({...form, before:e.target.value})}/>
                <input className="input" placeholder="後($)" value={form.after} onChange={e=>setForm({...form, after:e.target.value})}/>
                <input className="input" placeholder="ハンド数" value={form.hands} onChange={e=>setForm({...form, hands:e.target.value})}/>
                <input className="input" placeholder="稼働時間(h)" value={form.hours} onChange={e=>setForm({...form, hours:e.target.value})}/>
                <button className="btn" onClick={add}>追加</button>
              </div>
            </div>

            <div className="section">週次収支</div>
            <div className="grid week">
              {weeks.length === 0 && <div className="subtitle">データがありません。</div>}
              {weeks.map(([wk, val]) => (
                <div className="card" key={wk} style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                  <div>{wk}</div>
                  <div className={val>=0?'good mono':'bad mono'}>{fmt$(val)}</div>
                </div>
              ))}
            </div>

            <div className="section">月次収支</div>
            <div className="grid month">
              {months.length === 0 && <div className="subtitle">データがありません。</div>}
              {months.map(([mk, val]) => (
                <div className="card" key={mk} style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                  <div>{mk}</div>
                  <div className={val>=0?'good mono':'bad mono'}>{fmt$(val)}</div>
                </div>
              ))}
            </div>

            <div className="section">セッション一覧</div>
            <div className="card" style={{overflowX:'auto'}}>
              <table className="table">
                <thead>
                  <tr>
                    <th>日付</th>
                    <th>前($)</th>
                    <th>後($)</th>
                    <th>収支($)</th>
                    <th>時給($/h)</th>
                    <th>ハンド</th>
                    <th>時間(h)</th>
                  </tr>
                </thead>
                <tbody>
                  {enriched.length===0 && <tr><td colSpan="7" className="subtitle">まだデータがありません。</td></tr>}
                  {enriched.map(s => (
                    <tr key={s.id}>
                      <td>{s.date}</td>
                      <td className="mono">{fmt(s.before)}</td>
                      <td className="mono">{fmt(s.after)}</td>
                      <td className={`mono ${s.profit>=0?'good':'bad'}`}>{fmt(s.profit)}</td>
                      <td className="mono">{s.hours? fmt(Math.round(s.hourly)) : '—'}</td>
                      <td className="mono">{fmt(s.hands)}</td>
                      <td className="mono">{fmtH(s.hours)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div style={{marginTop:14, display:'flex', gap:8}}>
              <button className="btn" onClick={delAll}>全データ削除</button>
            </div>

            <div className="footer">
              <div>Tip: データはこのブラウザのこのURLに保存されます。別の端末/URL/シークレットモードでは共有されません。</div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
