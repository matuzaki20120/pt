<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ポーカー成績トラッカー（ライト／ダーク＋バックアップ対応）</title>
    <style>
      :root {
        --bg: #f7f7fb;
        --card: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --muted: #6b7280;
        --green: #059669;
        --red: #dc2626;
      }
      [data-theme='dark'] {
        --bg: #1f2937;
        --card: #374151;
        --border: #4b5563;
        --text: #f3f4f6;
        --muted: #9ca3af;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s, color 0.3s;
      }
      .container { max-width: 1040px; margin: 0 auto; padding: 32px 16px; }
      .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 12px; color: var(--muted); }
      .btn {
        border: 1px solid var(--border);
        background: var(--card);
        padding: 8px 12px;
        border-radius: 12px;
        cursor: pointer;
        color: var(--text);
      }
      .btn:hover { opacity: 0.8; }
      .card { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
      .stat-title { font-size: 12px; color: var(--muted); }
      .stat-value { margin-top: 4px; font-size: 22px; font-weight: 700; }
      .stat-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }
      .good { color: var(--green); }
      .bad { color: var(--red); }
      .mono { font-variant-numeric: tabular-nums; }
      .row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
      .input { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; background: var(--card); color: var(--text); }
      .footer { color: var(--muted); font-size: 11px; margin-top: 24px; }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;
      const LS_KEY = 'poker_sessions_v3';

      const loadData = () => {
        try {
          const raw = localStorage.getItem(LS_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch { return []; }
      };

      const saveData = (data) => {
        localStorage.setItem(LS_KEY, JSON.stringify(data));
      };

      function App(){
        const [sessions, setSessions] = useState(loadData);
        const [form, setForm] = useState({date:new Date().toISOString().slice(0,10),before:'',after:'',hands:'',hours:''});
        const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');

        useEffect(()=>{
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
        }, [theme]);

        useEffect(()=>{
          saveData(sessions);
        }, [sessions]);

        const totalProfit = sessions.reduce((a,b)=>a+(b.after-b.before),0);
        const totalHours = sessions.reduce((a,b)=>a+b.hours,0);
        const hourly = totalHours ? (totalProfit/totalHours).toFixed(2) : 0;

        const addSession = ()=>{
          const s = {
            id: crypto.randomUUID(),
            date: form.date,
            before: Number(form.before)||0,
            after: Number(form.after)||0,
            hands: Number(form.hands)||0,
            hours: Number(form.hours)||0
          };
          setSessions([...sessions, s]);
          setForm({date:new Date().toISOString().slice(0,10),before:'',after:'',hands:'',hours:''});
        };

        const backupToDrive = ()=>{
          const blob = new Blob([JSON.stringify(sessions,null,2)], {type:'application/json'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'poker_backup.json'; a.click();
          alert('Google Driveバックアップの代わりに、JSONファイルをダウンロードしました。');
        };

        return (
          <div className="container">
            <div className="header">
              <div>
                <div className="title">ポーカー成績トラッカー</div>
                <div className="subtitle">ローカル保存＋ライト／ダーク切り替え＋バックアップ機能</div>
              </div>
              <button className="btn" onClick={()=>setTheme(theme==='light'?'dark':'light')}>
                {theme==='light'?'🌙 ダーク':'☀️ ライト'}モード
              </button>
            </div>

            <div className="card" style={{marginTop:'20px'}}>
              <div className="stat-title">累計収支</div>
              <div className="stat-value">{totalProfit.toLocaleString()} $</div>
              <div className="stat-sub">平均時給: {hourly} $/h</div>
            </div>

            <div className="card" style={{marginTop:'20px'}}>
              <div className="stat-title">セッション追加</div>
              <div className="row">
                <input className="input" type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
                <input className="input" placeholder="前($)" value={form.before} onChange={e=>setForm({...form,before:e.target.value})}/>
                <input className="input" placeholder="後($)" value={form.after} onChange={e=>setForm({...form,after:e.target.value})}/>
                <input className="input" placeholder="ハンド数" value={form.hands} onChange={e=>setForm({...form,hands:e.target.value})}/>
                <input className="input" placeholder="稼働時間(h)" value={form.hours} onChange={e=>setForm({...form,hours:e.target.value})}/>
                <button className="btn" onClick={addSession}>追加</button>
              </div>
            </div>

            <div className="card" style={{marginTop:'20px'}}>
              <div className="stat-title">セッション一覧</div>
              {sessions.length===0 && <p className="subtitle">まだデータがありません。</p>}
              {sessions.map(s=>(
                <div key={s.id} style={{display:'flex',justifyContent:'space-between',borderBottom:'1px solid var(--border)',padding:'4px 0'}}>
                  <span>{s.date}</span>
                  <span>{(s.after-s.before).toFixed(0)} $</span>
                </div>
              ))}
            </div>

            <div style={{marginTop:'20px',display:'flex',gap:'10px'}}>
              <button className="btn" onClick={()=>{localStorage.removeItem(LS_KEY);setSessions([]);}}>全削除</button>
              <button className="btn" onClick={backupToDrive}>Google Driveにバックアップ</button>
            </div>
            <div className="footer">© 2025 Poker Tracker — ローカル保存＋ダークモード＋バックアップ対応</div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
